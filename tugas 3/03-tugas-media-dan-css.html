<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Media Kuliah Responsif</title>
    <link rel="stylesheet" href="03-tugas-style.css">
</head>
<body>

    <main>
        <section class="multimedia-section">
            <div class="media-card media-card--featured">
                <!-- Elemen Picture dengan Art Direction & WebP Responsif -->
                <picture class="media-card__cover">
                    <source media="(min-width: 1024px)" srcset="images/cover-desktop.webp" type="image/webp">
                    <source media="(min-width: 768px)" srcset="images/cover-tablet.webp" type="image/webp">
                    <img src="images/cover-mobile.webp" alt="Ilustrasi Sampul Kuliah Pemrograman Web" loading="lazy">
                </picture>

                <div class="media-card__content">
                    <h2 class="media-card__title">Kuliah Umum: Arsitektur Modern Web Development</h2>
                    <p class="media-card__desc">Pelajari bagaimana merancang aplikasi web modern yang responsif, cepat, dan menerapkan standar industri terkini.</p>
                </div>
                <!-- Pemutar Video dengan Poster dan Format Cadangan -->
                <div class="media-card__video-container">
                    <video controls poster="images/video-poster.jpg" preload="metadata" width="100%">
                        <source src="media/kuliah-web.webm" type="video/webm">
                        <source src="media/kuliah-web.mp4" type="video/mp4">
                        Maaf, peramban Anda tidak mendukung pemutar video HTML5.
                    </video>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
